version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
    environment:
      - NODE_ENV=development
    restart: unless-stopped
